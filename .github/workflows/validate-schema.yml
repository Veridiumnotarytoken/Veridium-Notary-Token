name: Validate JSON against VNT Schema

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g ajv-cli
      - run: ajv validate -s schema/vnt-1.0.schema.json -d "examples/*.json" --strict=false
      - run: ajv validate -s schema/vnt-1.0.schema.json -d "test-vectors/*.json" --strict=false
